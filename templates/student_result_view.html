<!DOCTYPE html>
<html>
<head>
    <title>Quiz Result</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #eef2f3, #d9e4f5);
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 500px;
            margin: 80px auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
            text-align: center;
        }

        h2 {
            color: #2c3e50;
            margin-bottom: 25px;
        }

        p {
            font-size: 16px;
            color: #333;
            margin: 10px 0;
        }

        .quiz-title {
            font-weight: bold;
            color: #1a73e8;
        }

        .score {
            font-size: 22px;
            font-weight: bold;
            color: #27ae60;
            margin: 15px 0;
        }

        .not-released {
            color: #e74c3c;
            font-weight: bold;
            background: #fdecea;
            padding: 10px;
            border-radius: 6px;
            margin-top: 15px;
        }

        .released {
            color: #2ecc71;
            font-weight: bold;
            background: #eafaf1;
            padding: 10px;
            border-radius: 6px;
            margin-top: 15px;
        }

        a {
            display: inline-block;
            margin-top: 25px;
            text-decoration: none;
            background: #1a73e8;
            color: white;
            padding: 10px 20px;
            border-radius: 6px;
            transition: background 0.3s;
        }

        a:hover {
            background: #1558b0;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Quiz Result</h2>

    <p><strong>Quiz:</strong> <span class="quiz-title">{{ result["title"] }}</span></p>
    <p class="score">Score: {{ result["score"] }}</p>

    {% if result["released"] == 0 %}
        <p class="not-released">Result not released by teacher yet</p>
    {% else %}
        <p class="released">Result released</p>
    {% endif %}

    <a href="/student/dashboard">Back to Dashboard</a>
</div>

</body>
</html>
