<!DOCTYPE html>
<html>
<head>
    <title>Teacher Profile</title>
    <style>
        /* ===== Body & Background ===== */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #74ebd5, #acb6e5);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* ===== Profile Card ===== */
        .profile-container {
            background-color: #ffffffcc; /* semi-transparent white */
            padding: 30px 40px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            max-width: 450px;
            width: 100%;
            text-align: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .profile-container:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 25px rgba(0,0,0,0.3);
        }

        h2 {
            margin-bottom: 25px;
            color: #2c3e50;
            font-size: 28px;
        }

        /* ===== Profile Items ===== */
        .profile-item {
            background-color: #f1f3f6;
            padding: 12px 15px;
            margin-bottom: 15px;
            border-radius: 8px;
            text-align: left;
            font-size: 16px;
            color: #34495e;
        }

        .label {
            font-weight: bold;
            color: #2c3e50;
        }

        /* ===== Buttons ===== */
        .buttons {
            margin-top: 20px;
        }

        button {
            padding: 10px 20px;
            margin: 5px 5px 0 0;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }

        /* Primary Buttons */
        .buttons form:nth-child(1) button,
        .buttons form:nth-child(2) button {
            background-color: #3498db;
            color: white;
        }

        .buttons form:nth-child(1) button:hover,
        .buttons form:nth-child(2) button:hover {
            background-color: #2980b9;
            transform: translateY(-2px);
        }

        /* Back Button */
        .back-button {
            background-color: #7fcacf;
            color: white;
        }

        .back-button:hover {
            background-color: #75b8bd;
            transform: translateY(-2px);
        }

        /* Responsive */
        @media(max-width: 500px) {
            .profile-container {
                padding: 20px;
            }

            h2 {
                font-size: 24px;
            }

            .profile-item {
                font-size: 14px;
            }

            button {
                font-size: 14px;
                padding: 8px 16px;
            }
        }
    </style>
</head>
<body>
    <div class="profile-container">
        <h2>Teacher Profile</h2>

        <div class="profile-item">
            <span class="label">Name:</span> {{ teacher.name }}
        </div>
        <div class="profile-item">
            <span class="label">Phone:</span> {{ teacher.phone }}
        </div>
        <div class="profile-item">
            <span class="label">Teacher ID:</span> {{ teacher.teacher_id }}
        </div>
        <div class="profile-item">
            <span class="label">Email (cannot change):</span> {{ teacher.email }}
        </div>

        <div class="buttons">
            <form action="{{ url_for('edit_profile') }}" method="get" style="display:inline;">
                <button type="submit">Edit Profile</button>
            </form>
            <form action="{{ url_for('edit_password') }}" method="get" style="display:inline;">
                <button type="submit">Edit Password</button>
            </form>
        </div>

        <div class="buttons">
            <form action="{{ url_for('teacher_dashboard') }}" method="get">
                <button type="submit" class="back-button">← Back</button>
            </form>
        </div>
    </div>
</body>
</html>
