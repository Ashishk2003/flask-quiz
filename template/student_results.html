<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Released Results</title>
    <style>
        /* General body style */
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f0f4f8;
            color: #333;
            margin: 0;
            padding: 20px;
        }

        /* Heading style */
        h2 {
            color: #2c3e50;
            text-align: center;
            margin-bottom: 30px;
        }

        /* Result container */
        .result {
            background-color: #fff;
            padding: 15px 20px;
            margin: 10px auto;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
            max-width: 500px;
        }

        /* Bold student name */
        .result b {
            color: #2980b9;
        }

        /* Back link style */
        a {
            display: inline-block;
            margin-top: 20px;
            text-decoration: none;
            color: #fff;
            background-color: #3498db;
            padding: 10px 20px;
            border-radius: 5px;
            transition: background-color 0.3s;
        }

        a:hover {
            background-color: #2980b9;
        }

        /* No results message */
        .no-results {
            text-align: center;
            font-style: italic;
            color: #888;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h2>Released Results</h2>

    {% if results %}
        {% for r in results %}
            <div class="result">
                <p><b>{{ r[0] }}</b> — Score: {{ r[1] }}</p>
            </div>
        {% endfor %}
    {% else %}
        <p class="no-results">No results released yet.</p>
    {% endif %}

    <a href="/student/dashboard">← Back</a>
</body>
</html>
