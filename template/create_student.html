<!DOCTYPE html>
<html>
<head>
    <title>Create Student</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 500px;
            margin: 40px auto;
            background: #ffffff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            color: #2c3e50;
        }

        h3 {
            margin-top: 30px;
            color: #34495e;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 8px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #2980b9;
        }

        .success {
            background-color: #eafaf1;
            color: #2ecc71;
            padding: 10px;
            border-radius: 5px;
            text-align: center;
            margin-bottom: 15px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        table th {
            background-color: #3498db;
            color: white;
            padding: 10px;
        }

        table td {
            padding: 8px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }

        table tr:hover {
            background-color: #f2f2f2;
        }

        a {
            display: block;
            text-align: center;
            margin-top: 20px;
            text-decoration: none;
            color: #3498db;
            font-weight: bold;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Create Student</h2>

    <!-- ✅ Success Message -->
    {% if created_student %}
    <div class="success">
        {{ created_student }}
    </div>
    {% endif %}

    <form method="post">
        <input type="text" name="name" placeholder="Student Name" required>

        <input type="email" name="email" placeholder="Student Email" required>

        <input type="text" name="roll_no" placeholder="Roll Number" required>

        <input type="password" name="password" placeholder="Temporary Password" required>

        <button type="submit">Create Student</button>
    </form>

    <h3>Total Students: {{ total_students }}</h3>

    <table>
        <tr>
            <th>Name</th>
            <th>Roll Number</th>
        </tr>

        {% for s in students %}
        <tr>
            <td>{{ s.name }}</td>
            <td>{{ s.roll_no }}</td>
        </tr>
        {% endfor %}
    </table>

    <a href="/teacher/dashboard">⬅ Back to Dashboard</a>

</div>

</body>
</html>
