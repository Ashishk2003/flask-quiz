<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Available Quiz</title>
    <style>
        /* ===== General Styles ===== */
        body {
            font-family: 'Arial', sans-serif;
            background: #f4f6f9;
            color: #333;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 800px;
            margin: 50px auto;
            padding: 20px 30px;
            background: #fff;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            border-radius: 10px;
        }

        h2 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 30px;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            padding: 15px 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            margin-bottom: 15px;
            background: #fafafa;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        li:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.1);
        }

        li strong {
            font-size: 1.2em;
            color: #34495e;
        }

        a {
            display: inline-block;
            margin-top: 8px;
            text-decoration: none;
            color: #fff;
            background: #3498db;
            padding: 8px 15px;
            border-radius: 5px;
            transition: background 0.2s;
        }

        a:hover {
            background: #2980b9;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            text-decoration: none;
            color: #555;
            font-weight: bold;
        }

        .back-link:hover {
            color: #2c3e50;
        }

        hr {
            border: none;
            border-top: 1px solid #eee;
            margin: 15px 0;
        }

        p {
            text-align: center;
            font-size: 1em;
            color: #504141;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Available Quiz</h2>

        {% if quizzes %}
            <ul>
                {% for quiz in quizzes %}
                    <li>
                        <strong>{{ quiz['title'] }}</strong><br>
                        <a href="/student/quiz/{{ quiz['id'] }}">Start Quiz</a>
                    </li>
                    <hr>
                {% endfor %}
            </ul>
        {% else %}
            <p>No quiz available.</p>
        {% endif %}

        <a href="{{ url_for('student_dashboard') }}" class="back-link">⬅ Back to Dashboard</a>
    </div>
</body>
</html>
