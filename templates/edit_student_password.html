<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Change Password</title>

    <style>
        body {
            background: linear-gradient(135deg, #667eea, #764ba2);
            font-family: Arial, sans-serif;
            height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card {
            background: white;
            padding: 30px;
            width: 350px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        h2 {
            margin-bottom: 20px;
            color: #333;
        }

        label {
            display: block;
            text-align: left;
            margin-bottom: 5px;
            color: #555;
            font-weight: bold;
        }

        input[type="password"] {
            width: 90%;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
            font-size: 16px;
        }

        .btn {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }

        .btn-submit {
            background-color: #667eea;
            color: white;
        }

        .btn-submit:hover {
            background-color: #5a67d8;
        }

        .btn-back {
            background-color: #e2dde9;
            color: #b93a3a;
        }
        .btn-back {
    width: auto;          /* decrease width */
    padding: 12px 26px;   /* control button size */
    align-self: center;   /* center inside column */
}

        .btn-back:hover {
            background-color: #d5d5d5;
        }

        /* ✅ FIX FOR OVERLAP */
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Change Password</h2>

        <form method="post" action="{{ url_for('edit_student_password') }}">
            <label for="password">New Password</label>
            <input type="password" name="password" id="password" required>

            <div class="btn-group">
                <button type="submit" class="btn btn-submit">
                    Change Password
                </button>

                <a href="{{ url_for('student_profile') }}" class="btn btn-back">
                    ← Back
                </a>
            </div>
        </form>
    </div>

</body>
</html>
