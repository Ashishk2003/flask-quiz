<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Quiz Result</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
            font-family: Arial, sans-serif;
        }

        .result-card {
            background-color: #ffffff;
            padding: 30px 40px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            text-align: center;
            width: 350px;
        }

        h2 {
            margin-bottom: 20px;
            color: #2c3e50;
        }

        p {
            font-size: 18px;
            margin-bottom: 25px;
            color: #333;
        }

        .score {
            font-size: 24px;
            font-weight: bold;
            color: #27ae60;
        }

        a {
            text-decoration: none;
            background-color: #3498db;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            font-size: 15px;
            transition: background-color 0.3s ease;
        }

        a:hover {
            background-color: #2c80b4;
        }
    </style>
</head>

<body>

    <div class="result-card">
        <h2>Your Quiz Result</h2>

        <p>
            <strong>Score:</strong>
            <span class="score">{{ score }} / {{ total }}</span>
        </p>

        <a href="/student/dashboard">← Back to Dashboard</a>
    </div>

</body>
</html>
