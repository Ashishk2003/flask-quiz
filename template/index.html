<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Online Quiz Management System</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
            font-family: Arial, Helvetica, sans-serif;
        }

        .container {
            background-color: white;
            padding: 40px 50px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        h2 {
            margin-bottom: 30px;
            color: #333;
        }

        a {
            display: block;
            text-decoration: none;
            background-color: #4a6cf7;
            color: white;
            padding: 12px;
            margin: 12px 0;
            border-radius: 6px;
            font-size: 16px;
            transition: 0.3s;
        }

        a:hover {
            background-color: #3b55d9;
            transform: scale(1.05);
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>Online Quiz Management System</h2>

        <a href="/teacher/login">Teacher Login</a>
        <a href="/student/login">Student Login</a>
    </div>
</body>
</html>
