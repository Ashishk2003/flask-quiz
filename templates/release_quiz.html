<!DOCTYPE html>
<html>
<head>
    <title>Release Quiz</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            padding: 30px;
        }

        h2 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 30px;
        }

        .quiz-box {
            background: white;
            padding: 15px 20px;
            margin-bottom: 15px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.08);
        }

        .quiz-title {
            font-size: 16px;
            font-weight: 600;
            color: #34495e;
        }

        .release-btn {
            background-color: #27ae60;
            color: white;
            padding: 6px 14px;
            text-decoration: none;
            border-radius: 5px;
            font-size: 14px;
        }

        .release-btn:hover {
            background-color: #219150;
        }

        .released-text {
            color: #888;
            font-size: 14px;
            font-weight: bold;
        }

        .back-link {
            display: inline-block;
            margin-top: 25px;
            text-decoration: none;
            color: white;
            background-color: #3498db;
            padding: 8px 16px;
            border-radius: 5px;
        }

        .back-link:hover {
            background-color: #2d83c5;
        }
    </style>
</head>

<body>

<h2>Release Quiz</h2>

{% for q in quizzes %}
<div class="quiz-box">
    <div class="quiz-title">{{ q.title }}</div>

    {% if q.released == 0 %}
        <a class="release-btn" href="/teacher/release/{{ q.id }}">Release</a>
    {% else %}
        <span class="released-text">Released</span>
    {% endif %}
</div>
{% endfor %}

<a class="back-link" href="/teacher/dashboard">Back</a>

</body>
</html>
